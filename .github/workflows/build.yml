name: Build All Platforms

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx tauri build --bundles deb rpm appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx tauri build --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager --install "ndk;27.0.12077973"
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Init Android
        run: npx tauri android init
      - name: Build Android APK
        run: npx tauri android build --apk --target aarch64
        env:
          NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
          ANDROID_HOME: /usr/local/lib/android/sdk
          JAVA_HOME: ${{ env.JAVA_HOME }}
      - name: Sign APK
        run: |
          keytool -genkey -v -keystore /tmp/hermes.keystore -alias hermes -keyalg RSA -keysize 2048 -validity 10000 -storepass hermes123 -keypass hermes123 -dname "CN=Hermes, OU=Relay, O=Hermes, L=Shanghai, ST=SH, C=CN"
          UNSIGNED_APK=$(find src-tauri/gen/android -name "*.apk" | head -1)
          cp "$UNSIGNED_APK" /tmp/unsigned.apk
          zipalign -v 4 /tmp/unsigned.apk /tmp/aligned.apk
          apksigner sign --ks /tmp/hermes.keystore --ks-pass pass:hermes123 --key-pass pass:hermes123 --out signed.apk /tmp/aligned.apk
          cp signed.apk hermes-relay.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-apk
          path: hermes-relay.apk

  release:
    needs: [build-linux, build-windows, build-macos, build-android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            linux-x86_64/**/*
            windows-x86_64/**/*
            macos-universal/**/*
            android-apk/**/*
